services:
  db:
    image: postgres:16-alpine
    container_name: app-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: prod
    container_name: app-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-app_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      FACTUS_URL: ${FACTUS_URL:-https://api.factus.com.co}
      FACTUS_CLIENT_ID: ${FACTUS_CLIENT_ID:-}
      FACTUS_CLIENT_SECRET: ${FACTUS_CLIENT_SECRET:-}
      FACTUS_USERNAME: ${FACTUS_USERNAME:-}
      FACTUS_PASSWORD: ${FACTUS_PASSWORD:-}
      FACTUS_NUMBERING_RANGE_ID: ${FACTUS_NUMBERING_RANGE_ID:-}
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-prod:
