# Development Profile (H2 File-Based Database by default, overridden by env vars in Docker)
# Los datos persisten entre reinicios (ej. Spring Boot DevTools) en backend/data/app_db.*.
# Borra la carpeta backend/data/ manualmente si necesitas arrancar con una base de datos limpia.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/app_db;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# Flyway Settings
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
